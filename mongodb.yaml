- name: configration mongodb
  hosts: mongodb
  become: yes
  tasks:
    - name: copy the mogodb repo
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo
    

    - name: install mongodb
      ansible.builtin.dnf:
        name: mongodb-org
        state: present
        
    - name: start the services
      ansible.builtin.service:
        name: mongod
        state: started
        enabled: yes
    
    - name: replace the services
      ansible.builtin.replace:
        path: /etc/mongod.conf
        regexp: '127.0.0.1'
        replace: '0.0.0.0'

    - name: restart the services
      ansible.builtin.service:
        name: mongod
        state: restarted    





